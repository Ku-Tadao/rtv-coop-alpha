name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate mod source
        run: python tools/build.py --check

      - name: Run regression checks
        run: python -m unittest discover -s tests -v

      - name: Build .vmz
        run: python tools/build.py

      - name: Read mod version
        id: mod
        run: |
          version=$(sed -n 's/^version="\(.*\)"$/\1/p' mod.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Downloaded artifacts arrive as a zip, so the .vmz lands inside one more
      # wrapper. The release asset below is the plain drag-and-drop file.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTVCoopAlpha-${{ steps.mod.outputs.version }}-${{ github.sha }}
          path: dist/*.vmz
          if-no-files-found: error

      - name: Attach .vmz to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vmz
          generate_release_notes: true
          body: |
            Drop the `.vmz` into your Road to Vostok `mods/` folder:

                <Steam>/steamapps/common/Road to Vostok/mods/

            Every player in the session must run the same file. Restart the game
            fully after replacing it.
